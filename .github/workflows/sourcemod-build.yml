name: SourceMod Build
on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - .github/workflows/sourcemod-build.yml
      - Makefile
      - '*Build*'
      - PackageScript
      - configure.py
      - '*lock.json'
      - extension/**
      - plugin-package-map.json
      - scripts/**
      - tests/**
      - addons/sourcemod/**
      - README.md
      - LICENSE
      - docs/**
  workflow_dispatch:
concurrency:
  group: sourcemod-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smx:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y python3 make g++-multilib
      - uses: actions/cache@v5
        with:
          path: .deps/smx
          key: smx-linux-${{ hashFiles('sourcepawn-package.lock.json', 'scripts/fetch-sourcemod.py') }}
      - run: make deps-smx
      - run: make build-smx build-api-test test-ci package-smx
      - uses: actions/upload-artifact@v6
        with:
          name: smx-package
          path: .build/package-smx
          if-no-files-found: error
          retention-days: 1
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y g++-multilib python3-venv make
      - if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: actions/cache@v5
        with:
          path: .deps/exts-${{ matrix.platform }}
          key: native-${{ matrix.os }}-x86-${{ hashFiles('dependencies.lock.json', 'scripts/fetch-extension-deps.py') }}
      - name: Resolve locked SDKs
        run: make deps-exts-${{ matrix.platform }} PYTHON=python
      - name: Build and test native extension
        run: make build-exts-${{ matrix.platform }} test-exts-${{ matrix.platform }} package-exts-${{ matrix.platform }} PYTHON=python
      - name: Sanitizers (isolated service, host architecture)
        if: matrix.platform == 'linux'
        run: python scripts/run-native-tests.py --platform linux --sanitize
      - uses: actions/upload-artifact@v6
        with:
          name: native-package-${{ matrix.platform }}
          path: .build/package-exts-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
  release:
    needs: [smx, native]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        platform: [linux, windows]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: smx-package
          path: .build/package-smx
      - uses: actions/download-artifact@v8
        with:
          name: native-package-${{ matrix.platform }}
          path: .build/package-exts-${{ matrix.platform }}
      - name: Resolve existing channel names
        id: channel
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            main) channel=latest ;;
            develop) channel=develop ;;
            *) channel="pr-${GITHUB_SHA::7}" ;;
          esac
          echo "basename=l4d2-speedwatch-${{ matrix.platform }}-$channel" >> "$GITHUB_OUTPUT"
      - name: Merge and validate existing binaries without SDKs
        run: make release-${{ matrix.platform }} validate-artifact PLATFORM=${{ matrix.platform }} RELEASE_BASENAME=unused LINUX_RELEASE_BASENAME=${{ steps.channel.outputs.basename }} WINDOWS_RELEASE_BASENAME=${{ steps.channel.outputs.basename }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: release
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Resolve channel tag
        id: channel
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            {
              echo 'tag=channel/latest'
              echo 'name=Latest'
              echo 'prerelease=false'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tag=channel/develop'
              echo 'name=Develop'
              echo 'prerelease=true'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Move channel tag after all required builds
        env:
          CHANNEL_TAG: ${{ steps.channel.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "$CHANNEL_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$CHANNEL_TAG" --force
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          name: ${{ steps.channel.outputs.name }}
          files: dist/release/*.zip
          fail_on_unmatched_files: true
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
